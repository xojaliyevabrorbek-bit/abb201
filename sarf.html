*{box-sizing:border-box}
body{margin:0;background:var(--pat),radial-gradient(ellipse at top,var(--bg2) 0,var(--bg) 70%);background-attachment:fixed;color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.9rem;margin:.6em 0 .1em}
h2{font-size:1.05rem;margin:1.6em 0 .5em}
.sub{margin:0;color:var(--mute)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--p)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--p);color:#fff;border-color:var(--p);padding:12px 22px;margin-top:6px}
button.primary:hover{background:var(--p2)}
button.on{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
button.link{border:0;background:none;color:var(--mute);text-decoration:underline}
.quick{display:flex;flex-wrap:wrap;gap:8px}
#lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:12px}
#lessons label{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 0;text-align:center;cursor:pointer;user-select:none}
#lessons input{position:absolute;opacity:0}
#lessons label:has(input:checked){background:var(--p);color:#fff;border-color:var(--p)}
#lessons label:has(input:focus-visible){outline:3px solid var(--gold)}
.radios{display:flex;flex-direction:column;gap:6px}
.info{color:var(--mute);min-height:1.5em}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.track{height:5px;background:var(--line);border-radius:3px;margin:6px 0 24px}
#fill{height:100%;width:0;background:var(--p);border-radius:3px;transition:width .25s}
.qlabel{color:var(--mute);margin:0}
.qtext{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 18px;margin:8px 0 18px;text-align:center;font-size:1.5rem}
.ar{font-family:Amiri,"Traditional Arabic","Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;line-height:2}
.qtext.ar,.qtext .ar{font-size:2.1rem}
#options{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:10px;width:100%}
.opt.ar{text-align:right;font-size:1.5rem;padding:8px 16px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
#next{margin-top:16px;width:100%}
.score{display:flex;align-items:baseline;gap:18px;margin:10px 0}
#sc{font-size:3rem;font-weight:600}#pc{font-size:2rem;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.w{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;margin:10px 0}
.w .q{font-size:1.1rem}.w .q.ar{font-size:1.5rem}
.w .a{margin-top:4px}.w .m{color:var(--mute);font-size:.9rem}
.good{color:var(--ok)}.badt{color:var(--bad)}

main{background:color-mix(in srgb,var(--bg) 78%,transparent);border-inline:1px solid var(--line);min-height:100vh}
.top{text-align:center;border-bottom:2px solid var(--gold);padding:6px 0 14px;margin-bottom:6px}
.top .ar{font-size:2.4rem;color:var(--p);line-height:1.6;display:block}
.top h1{margin:0}

<header class="top"><span class="ar" lang="ar">تَصْرِيفُ الْفِعْلِ</span><h1>Сарф: феъл шакллари</h1>
<p class="sub">«Мабдаус сарф» китоби асосида (ضَرَبَ феъли сийғалари)</p>
</header>
<p id="fatal" hidden>Маълумотлар юкланмади. Саҳифани янгиланг.</p>
<section id="setup">
  <h2>1. Мавзуни танланг (ҳар бири алоҳида тест)</h2>
  <div class="quick"><button data-r="malum">Маълум шакллар</button><button data-r="majhul">Мажҳул шакллар</button><button data-r="all">Барчаси</button></div>
  <div id="cats"></div>
  <h2>2. Йўналиш</h2>
  <div class="radios"><label><input type="radio" name="dir" value="uz-ar"> Ўзбекча → Арабча</label><label><input type="radio" name="dir" value="ar-uz"> Арабча → Ўзбекча</label><label><input type="radio" name="dir" value="mix" checked> Аралаш</label></div>
  <h2>3. Саволлар сони</h2>
  <div class="quick" id="counts"><button data-n="5">5 та</button><button data-n="10" class="on">10 та</button><button data-n="14">14 та</button><button data-n="0">Ҳаммаси</button></div>
  <p id="info" class="info"></p>
  <button id="start" class="primary">Тестни бошлаш</button>
</section>
<section id="quiz" hidden>
  <div class="bar"><span>Сарф тести &nbsp; <b id="progress"></b></span><button id="quit" class="link">Тугатиш</button></div>
  <div class="track"><div id="fill"></div></div>
  <span id="badge" class="badge"></span>
  <p id="qlabel" class="qlabel"></p><div id="qtext" class="qtext"></div>
  <div id="options"></div><p id="fb"></p><button id="next" class="primary" hidden>Кейингиси</button>
</section>
<section id="result" hidden>
  <h1>Натижа</h1>
  <div class="score"><span id="sc"></span><span id="pc"></span></div>
  <p id="detail"></p><p id="allok" class="allok" hidden>Барча саволлар тўғри!</p>
  <div class="row"><button id="retryWrong" class="primary">Хатоларни қайта ишлаш</button><button id="again">Янги тест</button></div>
  <h2 id="wrongTitle">Хато қилинган саволлар</h2><div id="wrongList"></div>
</section>
</main>

<!-- ===== ТЕСТ ЛОГИКАСИ ===== -->
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const strip=s=>s.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const words=s=>new Set(s.toLowerCase().replace(/[,.]/g,'').split(/\s+/).filter(Boolean));
function sim(a,b,ar){if(ar){const x=strip(a),y=strip(b);return 1-lev(x,y)/Math.max(x.length,y.length)+(a.split(' ')[0]===b.split(' ')[0]?.2:0);}
  const A=words(a),B=words(b);let i=0;A.forEach(w=>{if(B.has(w))i++;});return i/Math.max(1,A.size+B.size-i);}

let DATA=[];
try{ if(!Array.isArray(SARF_DATA)||!SARF_DATA.length) throw 0; DATA=SARF_DATA; }catch(e){ $('#setup').hidden=true; $('#fatal').hidden=false; return; }
const CATS=[];DATA.forEach(d=>{if(!CATS.find(c=>c.id===d.category))CATS.push({id:d.category,name:d.categoryName});});
const arCount={};DATA.forEach(d=>{arCount[d.arabic]=(arCount[d.arabic]||0)+1;});
const ambiguous=d=>arCount[d.arabic]>1;

/* ---- тест генератори (UI'дан мустақил) ---- */
function makeQuestion(item,dir,cats){
  const toUz=dir==='ar-uz',side=toUz?'uzbek':'arabic';
  const clash=c=>c===item||c.arabic===item.arabic||c.uzbek===item.uzbek;
  const tiers=[DATA.filter(d=>d.category===item.category),DATA.filter(d=>cats.includes(d.category)),DATA];
  const used=new Set([item[side]]),picked=[];
  for(const t of tiers){
    const c=t.filter(d=>!clash(d)).map(d=>({d,s:sim(d[side],item[side],!toUz)+Math.random()*.1})).sort((a,b)=>b.s-a.s);
    for(const {d} of c){if(picked.length>=3)break;if(used.has(d[side]))continue;used.add(d[side]);picked.push(d);}
    if(picked.length>=3)break;
  }
  return{item,dir,opts:shuffle([item,...picked]).map(d=>({text:d[side],ok:d===item}))};
}
function pool(cats,mode){return DATA.filter(d=>cats.includes(d.category)&&(mode!=='ar-uz'||!ambiguous(d)));}
const buildTest=(items,mode)=>{const cats=[...new Set(items.map(i=>i.category))];
  return shuffle(items).map(it=>makeQuestion(it,mode==='mix'?((ambiguous(it)||Math.random()<.5)?'uz-ar':'ar-uz'):mode,cats));};

/* ---- созлаш ---- */
let count=10,S=null;
CATS.forEach(c=>{const lb=el('label');lb.innerHTML=`<input type="checkbox" value="${c.id}"> ${c.name}`;$('#cats').append(lb);});
const sel=()=>$$('#cats input:checked').map(i=>i.value);
const mode=()=>document.querySelector('input[name=dir]:checked').value;
function refresh(){
  const cs=sel(),n=pool(cs,mode()).length,q=count===0?n:Math.min(count,n);
  $('#info').textContent=cs.length?`${cs.length} та мавзу, ${n} та савол мавжуд. Тестда: ${q}`+(mode()==='ar-uz'?' (бир хил ёзилган арабча шакллар бу йўналишда чиқмайди)':''):'Камида битта мавзу танланг.';
  $('#start').disabled=!cs.length;
}
$$('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;
  $$('#cats input').forEach(i=>{i.checked=r==='all'||(r==='malum'&&!i.value.includes('majhul'))||(r==='majhul'&&i.value.includes('majhul'));});refresh();});
$$('#counts button').forEach(b=>b.onclick=()=>{$$('#counts button').forEach(x=>x.classList.remove('on'));b.classList.add('on');count=+b.dataset.n;refresh();});
$('#cats').addEventListener('change',refresh);$$('input[name=dir]').forEach(i=>i.onchange=refresh);

/* ---- тест ---- */
function start(items,m){S={qs:buildTest(items,m),i:0,ok:0,wrong:[],mode:m};
  $('#setup').hidden=true;$('#result').hidden=true;$('#quiz').hidden=false;show();}
function show(){
  const q=S.qs[S.i],n=S.qs.length,toUz=q.dir==='ar-uz';
  $('#progress').textContent=`${S.i+1} / ${n}`;$('#fill').style.width=(S.i/n*100)+'%';
  $('#badge').textContent=q.item.categoryName;
  $('#qlabel').textContent=toUz?'Ўзбекча маъносини топинг':'Арабча шаклини топинг';
  const t=$('#qtext');t.textContent=toUz?q.item.arabic:q.item.uzbek;t.className='qtext'+(toUz?' ar':'');
  const box=$('#options');box.innerHTML='';
  q.opts.forEach((o,k)=>{const b=el('button','opt'+(toUz?'':' ar'),o.text);b.onclick=()=>answer(k);box.append(b);});
  $('#fb').textContent='';$('#next').hidden=true;q.done=false;
}
function answer(k){
  const q=S.qs[S.i];if(q.done)return;q.done=true;q.picked=k;
  const bs=$$('.opt');bs.forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');});
  if(q.opts[k].ok)S.ok++;else{bs[k].classList.add('bad');S.wrong.push(q);}
  $('#fb').textContent='Сийға: '+q.item.sigha;
  $('#next').textContent=S.i===S.qs.length-1?'Натижани кўриш':'Кейингиси';$('#next').hidden=false;$('#next').focus();
}
$('#next').onclick=()=>{S.i<S.qs.length-1?(S.i++,show()):finish();};
$('#quit').onclick=()=>{if(!confirm('Тестни тугатамизми?'))return;S.qs=S.qs.slice(0,S.i+(S.qs[S.i].done?1:0));S.qs.length?finish():back();};
document.addEventListener('keydown',e=>{if($('#quiz').hidden)return;
  if(/^[1-4]$/.test(e.key))answer(+e.key-1);else if(e.key==='Enter'&&!$('#next').hidden)$('#next').click();});

/* ---- натижа ---- */
function finish(){
  const n=S.qs.length,ok=S.ok;
  $('#quiz').hidden=true;$('#result').hidden=false;
  $('#sc').textContent=`Натижа: ${ok} / ${n}`;$('#pc').textContent=Math.round(ok/n*100)+'%';
  $('#detail').textContent=`Жами саволлар: ${n}. Тўғри: ${ok}. Нотўғри: ${n-ok}.`;
  const w=S.wrong,L=$('#wrongList');L.innerHTML='';
  $('#allok').hidden=!!w.length;$('#wrongTitle').hidden=!w.length;$('#retryWrong').hidden=!w.length;
  w.forEach(q=>{const toUz=q.dir==='ar-uz',d=el('div','w');
    const row=(lab,txt,ar,c)=>{const r=el('div','a '+c);r.append(lab+': ');r.append(el('span',ar?'ar':'',txt));return r;};
    d.append(el('div','m','Савол · '+q.item.categoryName),el('div','q'+(toUz?' ar':''),toUz?q.item.arabic:q.item.uzbek),
      row('Сизнинг жавобингиз',q.opts[q.picked].text,!toUz,'badt'),row('Тўғри жавоб',q.opts.find(o=>o.ok).text,!toUz,'good'),
      el('div','m','Сийға: '+q.item.sigha+' · китоб '+q.item.source.pages+'-бет'));
    L.append(d);});
}
function back(){$('#quiz').hidden=true;$('#result').hidden=true;$('#setup').hidden=false;refresh();}
$('#again').onclick=back;
